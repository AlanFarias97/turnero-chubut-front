<div
  class="bay-card"
  [ngClass]="{
    'occupied': bay.currentVehicle,
    'empty-bay-card': !bay.currentVehicle
  }"
  cdkDropList
  [id]="'bay-' + bay.id"
  [cdkDropListData]="
  bay.currentVehicle
    ? [bay.currentVehicle]
    : []
"
  [cdkDropListConnectedTo]="[
  'waiting-list',
  'completed-list',
  'bay-1',
  'bay-2',
  'bay-3'
]"
  [cdkDropListEnterPredicate]="canEnter"
  (cdkDropListDropped)="onDrop($event)">

  <div class="bay-header">

    {{ bay.name }}

  </div>

  <div
    class="bay-content"
    [class.empty]="!bay.currentVehicle">

    <ng-container *ngIf="bay.currentVehicle; else emptyBay">

      <div class="occupied-content">

        <app-vehicle-card
          [vehicle]="bay.currentVehicle">
        </app-vehicle-card>

        <div class="bay-actions">

          <button
            type="button"
            class="edit-button"
            aria-label="Editar vehiculo"
            title="Editar vehiculo"
            (click)="editVehicle()">

            <span class="edit-icon">
            </span>

          </button>

          <button
            type="button"
            class="finish-button"
            aria-label="Completar trabajo"
            title="Completar trabajo"
            (click)="completeVehicle()">

            <span class="finish-icon">
            </span>

          </button>

        </div>

      </div>

    </ng-container>

    <ng-template #emptyBay>

      <div class="empty-content">

        <div class="empty-title">
          Libre
        </div>

        <div class="empty-subtitle">
          Arrastrar vehículo aquí
        </div>

      </div>

    </ng-template>

  </div>

</div>
