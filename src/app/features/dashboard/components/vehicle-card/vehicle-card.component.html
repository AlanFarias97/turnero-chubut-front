<div
  class="vehicle-card"
  [ngClass]="{
    'waiting': vehicle.status === 'in_queue',
    'in-bay': vehicle.status === 'in_progress',
    'completed': vehicle.status === 'completed',
    'partial': vehicle.status === 'partial_completed',
    'not-completed': vehicle.status === 'not_completed'
  }"
  cdkDrag
  [cdkDragDisabled]="!draggable"
  [cdkDragData]="vehicle">

  <div class="vehicle-top">

    <div class="ticket-number">

      #{{ vehicle.ticketNumber }}

    </div>

    <button
      *ngIf="draggable"
      type="button"
      class="drag-handle"
      cdkDragHandle
      aria-label="Mover vehiculo"
      title="Mover vehiculo">

      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>

    </button>

    <div class="plate">

      {{ vehicle.patent }}

    </div>

    <div class="waiting-time">

      {{ vehicle.waitingMinutes }} min

    </div>

  </div>

  <div
    class="status-chip"
    [ngClass]="vehicle.status">

    {{ statusLabel }}

  </div>

  <div class="vehicle-info">

    {{ vehicle.description }}

  </div>

  <div class="service">

    {{ vehicle.service }}

  </div>

  <div class="operators">

    {{ vehicle.assignedOperators?.join(', ') }}

  </div>

  <div
    class="pending-work"
    *ngIf="vehicle.pendingWorkDetail">

    {{ vehicle.status === 'not_completed' ? 'Motivo' : 'Pendiente' }}:
    {{ vehicle.pendingWorkDetail }}

  </div>

</div>
